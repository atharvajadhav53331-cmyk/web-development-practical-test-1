<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Student Expense Tracker</h1>
      <p class="subtitle">Track and manage your daily expenses easily</p>
    </header>

    <!-- Total Summary Card -->
    <section class="summary-card" aria-live="polite">
      <span class="summary-label">Total Expenses (Showing)</span>
      <span id="total-amount" class="total-amount">₹0.00</span>
      <span id="overall-total" class="overall-total">Overall Total: ₹0.00</span>
    </section>

    <!-- Add Expense Form -->
    <section class="card">
      <h2>Add New Expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="expense-name">Expense Name</label>
            <input
              type="text"
              id="expense-name"
              placeholder="e.g., Lunch, Bus Pass, Notebook"
              required
            />
          </div>

          <div class="form-group">
            <label for="expense-amount">Amount</label>
            <input
              type="number"
              id="expense-amount"
              placeholder="0.00"
              step="0.01"
              min="0.01"
              required
            />
          </div>

          <div class="form-group">
            <label for="expense-category">Category</label>
            <select id="expense-category">
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <p id="error-message" class="error-message" role="alert"></p>

        <button type="submit" class="btn btn-primary">Add Expense</button>
      </form>
    </section>

    <!-- Filter & Expense List -->
    <section class="card">
      <div class="list-header">
        <h2>Expense History</h2>
        <div class="filter-group">
          <label for="filter-category">Filter:</label>
          <select id="filter-category">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <ul id="expense-list" class="expense-list">
        <li id="empty-state" class="empty-state">
          No expenses recorded yet. Add one above to get started!
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
